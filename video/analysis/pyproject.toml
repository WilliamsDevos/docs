[project]
name = "video-analysis"
version = "0.1.0"
description = "Análisis de audio para videos: tempo, golpes, secciones, voz y alineación de letra"
requires-python = ">=3.11"
dependencies = [
  "librosa==0.11.0",
  "numpy",
  "soundfile",
  "matplotlib",
  "faster-whisper==1.2.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "demucs==4.0.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
