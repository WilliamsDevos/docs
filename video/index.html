<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt → Video</title>
    <style>
      html, body { margin: 0; background: #000; color: #ccc; font: 13px/1.4 ui-monospace, monospace; }
      #c { display: block; width: 100vw; max-width: calc(100vh * 16 / 9); height: auto; margin: 0 auto; }
      #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(0,0,0,.6); display: flex; gap: 12px; align-items: center; }
      #ui input { flex: 1; }
      body.export #ui { display: none; }
      body.export #c { width: 1920px; height: 1080px; max-width: none; margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1920" height="1080"></canvas>
    <div id="ui">
      <span id="time">0.00</span>
      <input id="scrub" type="range" min="0" max="40" step="0.001" value="0" />
      <span>espacio: play · ←/→: ±1 s · ,/.: ±1 fotograma · h: ocultar</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
